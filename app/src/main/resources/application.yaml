spring:
  profiles:
    include: local, druid
  application:
    name: app
  jackson:
    default-property-inclusion: non_absent

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000

mybatis:
  config-location: classpath:mybatis/mybatis-config.xml
  mapper-locations: classpath:mybatis/mapper/**/*.xml

application:
  isapp: 1
  pagesize: 10
  sign:
    key: sign
  session:
    key: _USER